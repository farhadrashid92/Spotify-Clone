<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Music for Everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <script src="https://kit.fontawesome.com/26504e4a1f.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav>
        <ul>
            <li class="brand"><img src="logo.png" alt="Spotify Logo"> Spotify</li>
            <!-- Add navigation items as needed -->
        </ul>
    </nav>

    <div class="container">
        <div class="songList">
            <h1>Best of NCS - No Copyright Sounds</h1>
            <div class="songItemContainer">
                <!-- Repeat this block for each song -->
                <div class="songItem">
                    <img src="covers/1.jpg" alt="Cover 1">
                    <span class="songName">Let Me Love You</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="0" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/2.jpg" alt="Cover 2">
                    <span class="songName">Fade</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="1" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/3.jpg" alt="Cover 3">
                    <span class="songName">Spectre</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="2" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/4.jpg" alt="Cover 4">
                    <span class="songName">On & On</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="3" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/5.jpg" alt="Cover 5">
                    <span class="songName">Why We Lose</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="4" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/6.jpg" alt="Cover 6">
                    <span class="songName">Sky High</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="5" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/7.jpg" alt="Cover 7">
                    <span class="songName">Heroes Tonight</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="6" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/8.jpg" alt="Cover 8">
                    <span class="songName">Invincible</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="7" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/9.jpg" alt="Cover 9">
                    <span class="songName">My Heart</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="8" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/10.jpg" alt="Cover 10">
                    <span class="songName">On My Way</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            <i id="9" class="fas songItemPlay fa-play-circle"></i>
                        </span>
                    </span>
                </div>
            </div>
        </div>

        <div class="songBanner">
            <!-- Optional banner area -->
        </div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <i class="fas fa-2x fa-step-backward" id="previous"></i>
            <i class="fas fa-2x fa-play-circle" id="masterPlay"></i>
            <i class="fas fa-2x fa-step-forward" id="next"></i>
        </div>
        <div class="songInfo">
            <img src="playing.gif" width="42px" alt="Playing" id="gif">
            <span id="masterSongName">Let Me Love You</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
